server:
  port: 8088

spring:
  application:
    name: config-server
  profiles:
    active: native # Local file system එකෙන් configs ගන්නා බව දැක්වීමට
  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:/configurations # කලින් හැදූ config folder එකේ path එක
            - classpath:/configurations/platform
            - classpath:/configurations/services

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
#
#    register-with-eureka: false
#    fetch-registry: false